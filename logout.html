<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logout — MediCare HMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;
      background: url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=1600&auto=format&fit=crop') center/cover no-repeat fixed;
      position:relative;
    }
    body::before{
      content:'';
      position:fixed;inset:0;
      background:linear-gradient(135deg,rgba(26,43,74,0.88),rgba(21,101,192,0.82));
      z-index:0;
    }
    .card{position:relative;z-index:1;}
    .card{background:#fff;border-radius:16px;padding:48px 40px;text-align:center;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
    .icon{width:72px;height:72px;background:#ffebee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
    .icon i{font-size:2rem;color:#c62828;}
    h2{color:#1a2b4a;margin-bottom:10px;}
    p{color:#666;font-size:.9rem;margin-bottom:28px;line-height:1.6;}
    .user-info{background:#f5f7fa;border-radius:8px;padding:12px;margin-bottom:24px;font-size:.85rem;color:#333;}
    .user-info strong{color:#1a2b4a;}
    .btn-row{display:flex;gap:12px;}
    .btn{flex:1;padding:11px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s;}
    .btn-confirm{background:#c62828;color:#fff;}
    .btn-confirm:hover{background:#b71c1c;}
    .btn-cancel{background:#f5f7fa;color:#1a2b4a;border:1.5px solid #ddd;}
    .btn-cancel:hover{background:#e8eaf0;}
  </style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="fa fa-right-from-bracket"></i></div>
  <h2>Sign Out</h2>
  <p>Are you sure you want to sign out of MediCare HMS?</p>
  <div class="user-info" id="user-info">Loading...</div>
  <div class="btn-row">
    <button class="btn btn-cancel" onclick="window.location.href='index.html'">Cancel</button>
    <button class="btn btn-confirm" onclick="confirmLogout()">Sign Out</button>
  </div>
</div>
<script>
  const user = JSON.parse(localStorage.getItem('hms_user') || '{}');
  document.getElementById('user-info').innerHTML =
    `Signed in as <strong>${user.name || 'User'}</strong> (${user.role || 'admin'})`;

  function confirmLogout() {
    localStorage.removeItem('hms_user');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
